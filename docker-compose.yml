services:
  api:
    build:
      context: ./expense-api
      dockerfile: Dockerfile
    container_name: expense_api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/expenses.db
      - LOG_PATH=/app/data/app.log
      - MAX_EXPENSE_AMOUNT=100000000.00
    volumes:
      # Baza və log faylları lokal data/ qovluğuna yazılacaq
      - ./data:/app/data
    restart: unless-stopped

